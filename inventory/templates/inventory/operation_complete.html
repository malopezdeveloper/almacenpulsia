<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title}} | PULSIA Inventario</title><style>body{margin:0;display:grid;place-items:center;min-height:100vh;background:#f3f6fa;color:#182237;font:16px "Segoe UI",Arial}.card{max-width:620px;background:#fff;border:1px solid #dfe5ed;border-radius:12px;padding:32px;box-shadow:0 8px 30px #13274618}h1{color:#132746}.btn{display:inline-block;margin-top:12px;padding:11px 16px;border-radius:7px;background:#f47a20;color:#fff;text-decoration:none;font-weight:700}</style></head><body><div class="card"><h1>{{title}}</h1><p>{{message}}</p>{% if login_again %}<a class="btn" href="{% url 'login' %}">Iniciar sesión de nuevo</a>{% endif %}{% if close_window %}<p>Esta pestaña se cerrará automáticamente.</p><button class="btn" onclick="window.close()">Cerrar pestaña</button><script>setTimeout(()=>window.close(),1200);</script>{% endif %}</div></body></html>
