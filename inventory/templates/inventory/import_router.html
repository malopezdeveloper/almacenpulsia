{% extends 'inventory/base.html' %}{% block title %}Importar Excel · PULSIA{% endblock %}{% block content %}<h1>Importar Excel</h1><div class="card"><p>Seleccione explícitamente el destino. Un Excel ya no se interpreta automáticamente como una tabla de almacén.</p><form method="post" enctype="multipart/form-data">{% csrf_token %}<label>Destino</label><select name="destination"><option value="inventory">Almacén · tablas internas</option><option value="customers">Pedidos · Clientes</option><option value="suppliers">Pedidos · Proveedores</option><option value="units">Pedidos · Unidades AIKEN</option></select><label>Pedido de destino (solo para Unidades)</label><select name="order"><option value="">Seleccione…</option>{% for o in orders %}<option value="{{o.pk}}">#{{o.pk}} {{o.name}}</option>{% endfor %}</select><label>Archivo Excel</label><input type="file" name="file" accept=".xlsx,.xlsm" required><button class="btn" style="margin-top:14px">Importar al destino seleccionado</button></form></div>{% endblock %}
